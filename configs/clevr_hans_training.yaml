# configs/clevr_hans_training.yaml
experiment_name: "clevr_qcnn_confounder"

dataset:
  root: "./data/CLEVR-Hans3"
  variant: "clevr_hans3"      # or "clevr_hans7"

model:
  conv_channels: [64, 128, 256]
  hidden_sizes: [512, 256]
  dropout: 0.4

quantum:
  n_qubits: 10
  layers: 2
  backend: "lightning.qubit"

training:
  batch_size: 32              # ✅ Images plus petites
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping: 15
  num_workers: 4
  use_amp: true
