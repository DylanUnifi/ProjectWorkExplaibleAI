experiment_name: "clevr_qcnn_fast"

dataset:
  root: "./data/CLEVR-Hans3"
  variant: "clevr_hans3"

model:
  conv_channels: [64, 128, 256]
  hidden_sizes: [512, 256]
  dropout: 0.4

quantum:
  n_qubits: 4
  layers: 2
  backend: "lightning.qubit"

training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping: 15
  num_workers: 8
  use_amp: true
