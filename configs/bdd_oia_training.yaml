# configs/bdd_oia_training.yaml
experiment_name: "temporal_qcnn_blackwell"

dataset:
  root: "./data/bdd_oia"
  n_frames: 16  # Sample 16 frames from 5s video

model:
  conv_channels: [64, 128, 256]
  hidden_sizes: [512, 256]
  dropout: 0.3

quantum:
  n_qubits: 8
  layers: 3
  backend: "lightning.qubit"

training:
  batch_size: 32              # ✅ With AMP on Blackwell
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping: 10
  num_workers: 4              # ✅ Docker-safe
  use_amp: true               # ✅ Tensor Cores
