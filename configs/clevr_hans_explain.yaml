# configs/clevr_hans_explain.yaml
experiment_name: "clevr_explain_confounders"

model:
  checkpoint: "./checkpoints/clevr_hans/clevr_hans_clevr_qcnn_fast_v2/best_model.pth"
  conv_channels: [64, 128, 256]
  hidden_sizes: [512, 256]
  dropout: 0.3

dataset:
  root: "./data/CLEVR-Hans3"
  variant: "clevr_hans3"

quantum:
  n_qubits: 6
  layers: 3
  backend: "lightning.qubit"

methods:
  shap:
    enabled: true
    method: "deep"
  
  gradient:
    enabled: true

batch_size: 1
n_samples: 20                # Analyze both confounded & clean
output_dir: "./explanations/clevr_hans"
