services:
  workspace:
    build: .
    # On garde le conteneur en vie indéfiniment
    command: tail -f /dev/null
    shm_size: '8g'
    volumes:
      - .:/app               # On monte tout le code source (pratique pour le modifier en temps réel)
      - ./data:/app/data     # Montage des données
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tensorboard:
    build: .
    command: tensorboard --logdir /app/checkpoints --host 0.0.0.0 --port 6006
    ports:
      - "6006:6006"
    volumes:
      - ./checkpoints:/app/checkpoints